<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820"><defs><style>
  text { font-family: "Noto Serif", "DejaVu Serif", Georgia, serif; }
  .titulo { font-size: 26px; font-weight: 700; fill: #4a3410; text-anchor: middle; }
  .subtitulo { font-size: 14px; fill: #6b5b45; text-anchor: middle; font-style: italic; }
  .pie { font-size: 11px; fill: #6b5b45; text-anchor: middle; }
  .rot { font-size: 13px; fill: #2b2013; font-weight: 600; text-anchor: middle; paint-order: stroke; stroke: #fdf9ef; stroke-width: 3.4px; }
  .rot-izq { font-size: 12.5px; fill: #2b2013; font-weight: 600; text-anchor: end; paint-order: stroke; stroke: #fdf9ef; stroke-width: 3.4px; }
  .rot-der { font-size: 12.5px; fill: #2b2013; font-weight: 600; text-anchor: start; paint-order: stroke; stroke: #fdf9ef; stroke-width: 3.4px; }
  .rot-peq { font-size: 11.5px; fill: #4b3a1e; text-anchor: middle; paint-order: stroke; stroke: #fdf9ef; stroke-width: 3px; }
  .medida { font-size: 11px; fill: #7a5c33; text-anchor: middle; }
  .nota { font-size: 11.5px; fill: #4b5563; }
</style></defs><rect x="0" y="0" width="1200" height="88" fill="rgba(250,246,236,0.96)"/><text x="600.0" y="42" class="titulo">El tabernáculo del desierto</text><text x="600.0" y="70" class="subtitulo">Éxodo 25-40 · el atrio a escala (1 codo = 5 px); el tabernáculo va ampliado para poder leerlo</text><line x1="0" y1="88" x2="1200" y2="88" stroke="#b98a2b" stroke-width="2"/><rect x="0" y="756" width="1200" height="64" fill="rgba(250,246,236,0.96)"/><line x1="0" y1="756" x2="1200" y2="756" stroke="#b98a2b" stroke-width="1.4"/><text x="600.0" y="804" class="pie">Planos esquemáticos de Renacer · Atlas Bíblico · medidas tomadas de Éxodo 25-40, 1 Reyes 6-7 y Ezequiel 40-42, con las descripciones de Josefo</text><rect x="0" y="0" width="1200" height="820" fill="none" stroke="#c9bb97" stroke-width="6"/><rect x="350" y="180" width="500" height="250" fill="#f9f4e6" stroke="#8a6b2f" stroke-width="3" stroke-dasharray="12,6"/><text x="690.0" y="166" class="rot">Atrio: 100 × 50 codos (unos 50 × 25 m) · cortinas de lino sobre 60 columnas</text><rect x="550.0" y="424" width="100" height="12" fill="#b98a2b" stroke="#6b4c11" stroke-width="2"/><text x="600.0" y="462" class="rot">Puerta del atrio (20 codos)</text><rect x="450" y="210" width="300" height="95" fill="#efe2c4" stroke="#6b4c11" stroke-width="2.8"/><rect x="450" y="210" width="100" height="95" fill="#e3d3ab" stroke="#6b4c11" stroke-width="2.4"/><line x1="550" y1="200" x2="550" y2="315" stroke="#8b2f1f" stroke-width="3" stroke-dasharray="7,4"/><text x="500" y="250" class="rot-peq">Lugar</text><text x="500" y="268" class="rot-peq">Santísimo</text><text x="650" y="250" class="rot-peq">Lugar Santo</text><text x="550" y="192" class="medida">Velo (Éxodo 26:31-33)</text><rect x="476" y="270" width="48" height="20" fill="#c9a227" stroke="#6b4c11" stroke-width="1.8"/><text x="500" y="302" class="medida">Arca</text><rect x="590" y="266" width="34" height="20" fill="#e0cf9a" stroke="#6b4c11" stroke-width="1.8"/><text x="607" y="302" class="medida">Mesa de los panes</text><circle cx="695" cy="270" r="10" fill="none" stroke="#8a6b2f" stroke-width="2.4"/><line x1="695" y1="280" x2="695" y2="290" stroke="#8a6b2f" stroke-width="2.4"/><text x="695" y="302" class="medida">Candelabro</text><rect x="450" y="340" width="42" height="42" fill="#cbb08a" stroke="#7a5c33" stroke-width="2.2"/><text x="471" y="330" class="medida">Altar del holocausto</text><text x="471" y="398" class="medida">5 × 5 codos</text><circle cx="620" cy="361" r="17" fill="#cfe3f0" stroke="#4a7fa5" stroke-width="2.4"/><text x="620" y="330" class="medida">Fuente de bronce</text><text x="330" y="250" class="rot-izq">← Oeste</text><text x="330" y="272" class="rot-izq">Lugar Santísimo</text><text x="870" y="250" class="rot-der">Este →</text><text x="870" y="272" class="rot-der">puerta y altar</text><text x="66" y="660" class="nota">• El atrio se cerraba con cortinas de lino colgadas de sesenta columnas con basas de bronce.</text><text x="66" y="683" class="nota">• El pueblo permanecía en el atrio; los sacerdotes entraban al Lugar Santo y solo el sumo</text><text x="66" y="706" class="nota">• sacerdote al Lugar Santísimo, una vez al año (Levítico 16).</text><text x="66" y="729" class="nota">• La nube de la gloria de Dios llenó el tabernáculo cuando Moisés lo terminó (Éxodo 40:34-38).</text></svg>