<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820"><defs><style>
  text { font-family: "Noto Serif", "DejaVu Serif", Georgia, serif; }
  .titulo { font-size: 26px; font-weight: 700; fill: #4a3410; text-anchor: middle; }
  .subtitulo { font-size: 14px; fill: #6b5b45; text-anchor: middle; font-style: italic; }
  .pie { font-size: 11px; fill: #6b5b45; text-anchor: middle; }
  .rot { font-size: 13px; fill: #2b2013; font-weight: 600; text-anchor: middle; paint-order: stroke; stroke: #fdf9ef; stroke-width: 3.4px; }
  .rot-izq { font-size: 12.5px; fill: #2b2013; font-weight: 600; text-anchor: end; paint-order: stroke; stroke: #fdf9ef; stroke-width: 3.4px; }
  .rot-der { font-size: 12.5px; fill: #2b2013; font-weight: 600; text-anchor: start; paint-order: stroke; stroke: #fdf9ef; stroke-width: 3.4px; }
  .rot-peq { font-size: 11.5px; fill: #4b3a1e; text-anchor: middle; paint-order: stroke; stroke: #fdf9ef; stroke-width: 3px; }
  .medida { font-size: 11px; fill: #7a5c33; text-anchor: middle; }
  .nota { font-size: 11.5px; fill: #4b5563; }
</style></defs><rect x="0" y="0" width="1200" height="88" fill="rgba(250,246,236,0.96)"/><text x="600.0" y="42" class="titulo">El templo de Herodes y su explanada</text><text x="600.0" y="70" class="subtitulo">Siglo I · Josefo, Antigüedades XV-XVII, y la arqueología de Jerusalén</text><line x1="0" y1="88" x2="1200" y2="88" stroke="#b98a2b" stroke-width="2"/><rect x="0" y="756" width="1200" height="64" fill="rgba(250,246,236,0.96)"/><line x1="0" y1="756" x2="1200" y2="756" stroke="#b98a2b" stroke-width="1.4"/><text x="600.0" y="804" class="pie">Planos esquemáticos de Renacer · Atlas Bíblico · medidas tomadas de Éxodo 25-40, 1 Reyes 6-7 y Ezequiel 40-42, con las descripciones de Josefo</text><rect x="0" y="0" width="1200" height="820" fill="none" stroke="#c9bb97" stroke-width="6"/><rect x="270" y="200" width="760" height="330" fill="#f9f4e6" stroke="#8a6b2f" stroke-width="3"/><text x="286" y="226" class="rot-der">Atrio de los gentiles y pórticos reales</text><text x="1014" y="226" class="rot-izq">Explanada: unos 480 × 300 m</text><rect x="300" y="134" width="150" height="60" fill="#d9cbb0" stroke="#7a5c33" stroke-width="2.4"/><text x="375" y="124" class="rot">Torre Antonia (guarnición romana)</text><rect x="790" y="140" width="140" height="54" fill="#cfe3f0" stroke="#4a7fa5" stroke-width="2.2"/><text x="860" y="130" class="rot">Estanque de Betesda</text><rect x="670" y="270" width="330" height="240" fill="#efe2c4" stroke="#b98a2b" stroke-width="2.4" stroke-dasharray="9,5"/><text x="835" y="322" class="rot-peq">Atrio de las mujeres</text><rect x="720" y="300" width="240" height="180" fill="#e9dcb8" stroke="#8a6b2f" stroke-width="2.2"/><text x="732" y="466" class="rot-peq">Atrio de Israel y de los sacerdotes</text><rect x="770" y="318" width="140" height="110" fill="#fdf9ef" stroke="#6b4c11" stroke-width="3"/><text x="840" y="308" class="rot">Santuario: 100 codos de alto</text><text x="896" y="348" class="rot-der">Lugar Santo</text><text x="784" y="348" class="rot-der">Lugar</text><text x="784" y="366" class="rot-der">Santísimo</text><line x1="812" y1="318" x2="812" y2="428" stroke="#6b4c11" stroke-width="2"/><rect x="810" y="488" width="60" height="34" fill="#cbb08a" stroke="#7a5c33" stroke-width="2.2"/><text x="840" y="536" class="rot-peq">Altar de los holocaustos</text><rect x="1024" y="330" width="12" height="70" fill="#b98a2b" stroke="#6b4c11" stroke-width="1.6"/><text x="1050" y="370" class="rot-der">Puerta Dorada (este)</text><rect x="264" y="330" width="12" height="70" fill="#b98a2b" stroke="#6b4c11" stroke-width="1.6"/><text x="250" y="370" class="rot-izq">Puerta de Suse (oeste)</text><rect x="610" y="524" width="70" height="12" fill="#b98a2b" stroke="#6b4c11" stroke-width="1.6"/><text x="645" y="556" class="rot-peq">Puerta de Hulda (sur)</text><rect x="70" y="440" width="130" height="50" fill="#cfe3f0" stroke="#4a7fa5" stroke-width="2.2"/><text x="70" y="426" class="rot-der">Estanque de Siloé</text><path d="M200 458 C 250 432, 330 440, 480 476" fill="none" stroke="#4a7fa5" stroke-width="2.6" stroke-dasharray="8,5"/><text x="330" y="426" class="rot-peq">Túnel de Ezequías (533 m)</text><text x="66" y="636" class="nota">• El santuario seguía las proporciones del de Salomón (1 Reyes 6) con un pórtico de 100 codos de alto.</text><text x="66" y="659" class="nota">• Una balaustrada (soreg) separaba el atrio de los gentiles con avisos en griego y en latín.</text><text x="66" y="682" class="nota">• Jesús enseñó en el pórtico de Salomón, en el atrio de los gentiles (Juan 10:23; Hechos 3:11).</text><text x="66" y="705" class="nota">• Los romanos destruyeron el templo en el año 70 d.C.; solo queda en pie el muro occidental.</text></svg>