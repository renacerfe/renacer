<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820"><defs><style>
  text { font-family: "Noto Serif", "DejaVu Serif", Georgia, serif; }
  .titulo { font-size: 26px; font-weight: 700; fill: #4a3410; text-anchor: middle; }
  .subtitulo { font-size: 14px; fill: #6b5b45; text-anchor: middle; font-style: italic; }
  .pie { font-size: 11px; fill: #6b5b45; text-anchor: middle; }
  .rot { font-size: 13px; fill: #2b2013; font-weight: 600; text-anchor: middle; paint-order: stroke; stroke: #fdf9ef; stroke-width: 3.4px; }
  .rot-izq { font-size: 12.5px; fill: #2b2013; font-weight: 600; text-anchor: end; paint-order: stroke; stroke: #fdf9ef; stroke-width: 3.4px; }
  .rot-der { font-size: 12.5px; fill: #2b2013; font-weight: 600; text-anchor: start; paint-order: stroke; stroke: #fdf9ef; stroke-width: 3.4px; }
  .rot-peq { font-size: 11.5px; fill: #4b3a1e; text-anchor: middle; paint-order: stroke; stroke: #fdf9ef; stroke-width: 3px; }
  .medida { font-size: 11px; fill: #7a5c33; text-anchor: middle; }
  .nota { font-size: 11.5px; fill: #4b5563; }
</style></defs><rect x="0" y="0" width="1200" height="88" fill="rgba(250,246,236,0.96)"/><text x="600.0" y="42" class="titulo">Jerusalén en tiempos de Jesús</text><text x="600.0" y="70" class="subtitulo">Plano esquemático de la ciudad, sus murallas y sus valles</text><line x1="0" y1="88" x2="1200" y2="88" stroke="#b98a2b" stroke-width="2"/><rect x="0" y="756" width="1200" height="64" fill="rgba(250,246,236,0.96)"/><line x1="0" y1="756" x2="1200" y2="756" stroke="#b98a2b" stroke-width="1.4"/><text x="600.0" y="804" class="pie">Planos esquemáticos de Renacer · Atlas Bíblico · medidas tomadas de Éxodo 25-40, 1 Reyes 6-7 y Ezequiel 40-42, con las descripciones de Josefo</text><rect x="0" y="0" width="1200" height="820" fill="none" stroke="#c9bb97" stroke-width="6"/><path d="M150 110 C 250 290, 265 445, 210 570 L 300 570 C 355 445, 340 290, 235 110 Z" fill="#cfe3f0" fill-opacity="0.8"/><text x="200" y="240" class="rot">Valle del Cedrón</text><path d="M700 590 C 780 495, 900 440, 1090 420 L 1090 485 C 930 505, 850 550, 800 590 Z" fill="#cfe3f0" fill-opacity="0.8"/><text x="950" y="532" class="rot">Valle de Hinom (Gehena)</text><path d="M300 190 L 560 170 L 690 285 L 690 440 L 520 565 L 300 525 Z" fill="#f9f4e6" stroke="#8a6b2f" stroke-width="3"/><path d="M690 285 L 860 320 L 900 440 L 690 440 Z" fill="#efe2c4" stroke="#8a6b2f" stroke-width="3"/><text x="470" y="315" class="rot">Ciudad alta</text><text x="795" y="400" class="rot">Ciudad baja</text><rect x="690" y="190" width="230" height="145" fill="#e3d3ab" stroke="#6b4c11" stroke-width="3"/><text x="805" y="178" class="rot">Explanada del templo</text><rect x="770" y="224" width="80" height="76" fill="#fdf9ef" stroke="#6b4c11" stroke-width="2.4"/><text x="810" y="266" class="rot-peq">Santuario</text><rect x="640" y="188" width="52" height="40" fill="#d9cbb0" stroke="#7a5c33" stroke-width="2"/><text x="634" y="168" class="rot-der">Torre Antonia</text><rect x="340" y="202" width="130" height="80" fill="#e8dcc0" stroke="#7a5c33" stroke-width="2"/><text x="405" y="246" class="rot-peq">Palacio de Herodes</text><circle cx="420" cy="490" r="7" fill="#8b2f1f"/><text x="420" y="476" class="rot">Monte Sion · cenáculo</text><rect x="950" y="196" width="110" height="46" fill="#cfe3f0" stroke="#4a7fa5" stroke-width="2.2"/><text x="1005" y="184" class="rot">Estanque de Betesda</text><rect x="620" y="578" width="130" height="46" fill="#cfe3f0" stroke="#4a7fa5" stroke-width="2.2"/><text x="700" y="646" class="rot">Estanque de Siloé</text><circle cx="900" cy="120" r="7" fill="#5c7a29"/><text x="900" y="106" class="rot">Getsemaní</text><circle cx="600" cy="130" r="7" fill="#8b2f1f"/><text x="600" y="116" class="rot">Gólgota</text><circle cx="470" cy="174" r="5.5" fill="#b98a2b" stroke="#6b4c11" stroke-width="1"/><text x="470" y="162" class="rot-peq">Puerta de Damasco</text><circle cx="318" cy="400" r="5.5" fill="#b98a2b" stroke="#6b4c11" stroke-width="1"/><text x="306" y="404" class="rot-izq">Puerta de Jaffa</text><circle cx="460" cy="556" r="5.5" fill="#b98a2b" stroke="#6b4c11" stroke-width="1"/><text x="460" y="578" class="rot-peq">Puerta de Sion</text><circle cx="620" cy="574" r="5.5" fill="#b98a2b" stroke="#6b4c11" stroke-width="1"/><text x="620" y="596" class="rot-peq">Puerta del Estiércol</text><circle cx="700" cy="540" r="5.5" fill="#b98a2b" stroke="#6b4c11" stroke-width="1"/><text x="700" y="562" class="rot-peq">Puerta de la Fuente</text><circle cx="700" cy="424" r="5.5" fill="#b98a2b" stroke="#6b4c11" stroke-width="1"/><text x="712" y="428" class="rot-der">Puerta del Agua</text><circle cx="700" cy="240" r="5.5" fill="#b98a2b" stroke="#6b4c11" stroke-width="1"/><text x="712" y="244" class="rot-der">Puerta de las Ovejas</text><circle cx="920" cy="250" r="5.5" fill="#b98a2b" stroke="#6b4c11" stroke-width="1"/><text x="932" y="254" class="rot-der">Puerta Dorada</text><text x="66" y="636" class="nota">• La ciudad ocupaba unas 100 hectáreas y en el siglo I estaba rodeada por tres murallas.</text><text x="66" y="659" class="nota">• El Cedrón separa la ciudad del monte de los Olivos; el Hinom (Gehena) la rodea por el sur.</text><text x="66" y="682" class="nota">• El túnel de Ezequías llevaba el agua del manantial de Gihón hasta el estanque de Siloé.</text></svg>