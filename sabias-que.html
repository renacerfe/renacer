<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sabías que... - Curiosidades Bíblicas</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Libre+Baskerville:ital,wght@0,400;0,700&family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --parch-900: #12100e;
    --gold-bright: #f0c040;
    --gold-main:   #d4a017;
    --text-hero:   #fdf4e0;
    --text-body:   #d4c4a8;
    --text-soft:   #a89070;
  }

  body {
    background-color: var(--parch-900);
    background-image: 
      radial-gradient(ellipse 80% 60% at 50% 0%, rgba(212,160,23,0.08) 0%, transparent 70%);
    font-family: 'Libre Baskerville', serif;
    color: var(--text-body);
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
  }

  /* Estilo del Título Principal */
  .main-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(3rem, 10vw, 6rem);
    font-weight: 900;
    color: var(--text-hero);
    margin-bottom: 10px;
    text-shadow: 0 4px 20px rgba(0,0,0,0.8);
    animation: fadeInDown 1.2s ease-out;
  }

  .ornament {
    color: var(--gold-main);
    font-size: 1.5rem;
    letter-spacing: 0.5em;
    margin-bottom: 20px;
    opacity: 0.8;
  }

  /* Frase Bíblica */
  .bible-quote {
    max-width: 700px;
    padding: 0 24px;
    margin-bottom: 50px;
    animation: fadeIn 2s ease-in;
  }

  .quote-text {
    font-size: clamp(1.1rem, 2.5vw, 1.4rem);
    font-style: italic;
    line-height: 1.8;
    color: var(--text-hero);
  }

  .quote-ref {
    display: block;
    font-family: 'Cinzel', serif;
    font-size: 0.8rem;
    color: var(--gold-main);
    margin-top: 15px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }

  /* Menú de Navegación */
  .menu-container {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    justify-content: center;
    animation: fadeInUp 1s ease-out;
  }

  .nav-btn {
    background: rgba(212,160,23,0.05);
    border: 1px solid var(--gold-main);
    color: var(--gold-bright);
    font-family: 'Cinzel', serif;
    font-size: 0.85rem;
    padding: 12px 30px;
    text-decoration: none;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    transition: all 0.3s ease;
    cursor: pointer;
  }

  .nav-btn:hover {
    background: var(--gold-main);
    color: var(--parch-900);
    box-shadow: 0 0 15px rgba(212,160,23,0.4);
    transform: translateY(-2px);
  }

  /* Animaciones */
  @keyframes fadeInDown {
    from { opacity: 0; transform: translateY(-30px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  /* Línea decorativa */
  .hero-rule {
    width: 200px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold-main), transparent);
    margin: 30px auto;
  }
</style>
</head>
<body>

  <div class="ornament">✦ ✦ ✦</div>
  
  <h1 class="main-title">¿Sabías que?</h1>
  
  <div class="hero-rule"></div>

  <div class="bible-quote">
    <p class="quote-text">
      "Clama a mí, y yo te responderé, y te enseñaré cosas grandes y ocultas que tú no conoces."
    </p>
    <span class="quote-ref">— Jeremías 33:3 —</span>
  </div>

  <nav class="menu-container">
    <a href="nombres-de-Dios.html" class="nav-btn">Nombres de Dios</a>
    <a href="#" class="nav-btn">Curiosidades</a>
    <a href="#" class="nav-btn">Cronología</a>
  </nav>

</body>
</html>
